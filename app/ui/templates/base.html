<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Stocker{% endblock %} — Stocker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a class="brand" href="/">Stocker</a>
    <nav>
      <a href="/">Панель</a>
      <a href="/attention">Требует внимания</a>
      <a href="/approved">Одобрено</a>
      <a href="/blocked">Заблокировано</a>
      <a href="/rejected">Отклонено</a>
    </nav>
    <span class="catalog">production · data/prod</span>
  </header>
  <main>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
  <script src="/static/ui.js"></script>
</body>
</html>
